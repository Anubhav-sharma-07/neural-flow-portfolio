<style>
:root {
  /* Layout concept: one dark ground, a 1160px column, wireframe thumbnails for the work grid, and a single blue accent reserved for actions and focus. */

}

/* ---------- type ---------- */

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: 0.95rem; text-decoration: none; line-height: 1.2; transition: background 0.18s, border-color 0.18s, transform 0.18s, color 0.18s; }

/* ---------- hero ---------- */
.hero { position: relative; padding-block: clamp(48px, 7vw, 96px) clamp(56px, 8vw, 104px); isolation: isolate; }

.hero-grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr); gap: clamp(32px, 5vw, 64px); align-items: center; }
.hero-copy { display: grid; gap: 24px; justify-items: start; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
main:focus { outline: none; }
.avail { display: inline-flex; align-items: center; gap: 10px; font-size: 0.86rem; color: var(--fg-2); padding: 7px 14px 7px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(70, 211, 154, 0.6); animation: pulse 2.4s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(70, 211, 154, 0); } 100% { box-shadow: 0 0 0 0 rgba(70, 211, 154, 0); } }
.caps { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.02em; }
.panel { border: 1px solid var(--line-2); border-radius: 14px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02) inset; overflow: hidden; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-title { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.tab { border: 0; background: transparent; color: var(--fg-2); font-size: 0.8rem; font-weight: 600; padding: 9px 12px; border-radius: 7px; transition: background 0.15s, color 0.15s; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent); color: #fff; }
.panel-body { padding: 22px 20px 8px; min-height: 224px; }
.panel-list { display: grid; gap: 14px; font-family: var(--font-mono); font-size: 0.86rem; color: var(--fg-2); }
.panel-list li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; animation: rise 0.35s ease both; }
.panel-list li::before { content: "›"; color: var(--accent-text); }
.panel-list li:nth-child(2) { animation-delay: 0.04s; }
.panel-list li:nth-child(3) { animation-delay: 0.08s; }
.panel-list li:nth-child(4) { animation-delay: 0.12s; }

@keyframes rise { from { opacity: 0; transform: translateY(5px); } }
.panel-foot { padding: 14px 20px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px dashed var(--line-2); margin-top: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 0.78rem; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--fg-2); background: var(--bg-2); white-space: nowrap; }
@media (max-width: 960px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- sections ---------- */
.section { padding-block: clamp(52px, 7vw, 88px); }
.section-alt { background: var(--bg-2); border-block: 1px solid var(--line); }
.section-head { display: grid; gap: 14px; margin-bottom: clamp(32px, 5vw, 56px); max-width: 720px; }
.section-head p { color: var(--fg-2); font-size: 1.05rem; max-width: 60ch; }
.section-head p.eyebrow { color: var(--accent-text); font-size: 0.8rem; max-width: none; }

/* ---------- work ---------- */
.work-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.card { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; }
.card:hover { border-color: var(--line-2); transform: translateY(-3px); box-shadow: 0 24px 48px -28px rgba(0, 0, 0, 0.9); }
.card.featured { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.card.featured .shot { height: 100%; aspect-ratio: auto; min-height: 280px; border-bottom: 0; border-right: 1px solid var(--line); }
.card-body { padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; flex: 1; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.badge { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-text); border: 1px solid rgba(142, 170, 255, 0.25); white-space: nowrap; }
.cat { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.card h3 { font-size: 1.45rem; letter-spacing: -0.02em; font-weight: 800; }
.card h3 small { font-size: 0.8rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 8px; }
.card p { color: var(--fg-2); font-size: 0.97rem; }
.card-actions { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
@media (max-width: 900px) {
  .work-grid { grid-template-columns: minmax(0, 1fr); }

}
.work-note { margin-top: 28px; font-size: 0.88rem; color: var(--muted); max-width: 70ch; }

/* wireframe thumbnails: abstract, meant to be swapped for real screenshots */
.shot { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; background: linear-gradient(160deg, hsl(var(--h) 38% 15%), var(--surface) 78%); border-bottom: 1px solid var(--line); text-decoration: none; }
.shot > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform 0.4s ease; }
.card:hover .shot > img { transform: scale(1.02); }
.win { position: absolute; inset: 7% 7% 0 7%; border: 1px solid hsl(var(--h) 28% 30%); border-bottom: 0; border-radius: 10px 10px 0 0; background: hsl(var(--h) 24% 8%); display: flex; flex-direction: column; transition: transform 0.4s ease; }
.card:hover .win { transform: translateY(-5px); }
.win-bar { height: 28px; display: flex; align-items: center; gap: 5px; padding: 0 10px; border-bottom: 1px solid hsl(var(--h) 20% 18%); flex: none; }
.win-bar i { width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--h) 20% 24%); }
.win-url { margin-left: 8px; font-family: var(--font-mono); font-size: 9.5px; color: hsl(var(--h) 18% 58%); background: hsl(var(--h) 22% 12%); padding: 2px 9px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.win-body { flex: 1; padding: 12px; display: flex; gap: 10px; min-height: 0; }
.win-body .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.b { background: hsl(var(--h) 30% 20%); border-radius: 4px; }
.b.hi { background: hsl(var(--h) 62% 52%); }
.b.mid { background: hsl(var(--h) 38% 30%); }
.row { display: flex; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.bars { display: flex; align-items: flex-end; gap: 6px; flex: 1; }
.bars .b { flex: 1; }

/* ---------- proof strip ---------- */
.proof { border-block: 1px solid var(--line); background: var(--bg); }
.proof-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.proof-item { padding: 22px 24px 22px 0; display: grid; gap: 4px; align-content: start; }
.proof-item + .proof-item { padding-left: 24px; border-left: 1px solid var(--line); }
.proof-item strong { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
.proof-item span { font-size: 0.86rem; color: var(--muted); line-height: 1.5; }
@media (max-width: 960px) {
  .proof-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .proof-item:nth-child(odd) { padding-left: 0; border-left: 0; }
  .proof-item:nth-child(n + 3) { border-top: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .proof-grid { grid-template-columns: minmax(0, 1fr); }
  .proof-item, .proof-item + .proof-item { padding: 16px 0; border-left: 0; }
  .proof-item + .proof-item { border-top: 1px solid var(--line); }
}

/* ---------- more builds ---------- */
.more { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--line); display: grid; gap: 24px; }
.more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.more-item { display: grid; gap: 10px; align-content: start; min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

/* ---------- about: right now ---------- */
.now { margin-top: 28px; padding: 20px 22px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); display: grid; gap: 10px; max-width: 60ch; }
.now ul { display: grid; gap: 8px; color: var(--fg-2); font-size: 0.97rem; }
.now li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.now li::before { content: ""; width: 6px; height: 6px; margin-top: 11px; border-radius: 50%; background: var(--accent); }

/* ---------- flow diagram ---------- */
.flow { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; }
.flow li { position: relative; display: grid; gap: 4px; align-content: start; padding: 14px; margin-right: 24px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg-2); min-width: 0; }

.flow li:not(:last-child)::after { content: "→"; position: absolute; right: -24px; top: 50%; width: 24px; transform: translateY(-50%); text-align: center; color: var(--accent-text); font-family: var(--font-mono); }

.flow span { font-size: 0.82rem; color: var(--muted); line-height: 1.45; }

.case-sec .flow li::before { content: none; }
@media (max-width: 760px) {
  .flow { grid-template-columns: minmax(0, 1fr); }
  .flow li { margin: 0 0 26px; }

  .flow li:not(:last-child)::after { content: "↓"; right: auto; left: 50%; top: auto; bottom: -26px; transform: translateX(-50%); }
}
.auto { margin-top: 40px; padding: clamp(20px, 3vw, 32px); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: grid; gap: 18px; }
.auto .note { font-size: 0.86rem; color: var(--muted); }

/* ---------- faq ---------- */
.faq { max-width: 820px; border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 60px; padding: 14px 4px; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }

.svc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

.svc-icon { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; background: hsl(var(--h) 45% 18%); border: 1px solid hsl(var(--h) 40% 30%); color: hsl(var(--h) 85% 78%); font-size: 1.2rem; }

.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; }

/* ---------- why ---------- */
.why-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.why { padding: 28px 24px 8px 0; display: grid; gap: 12px; align-content: start; }
